name: build_host

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            docker_image: osrf/ros:humble-desktop
          - ros_distro: jazzy
            docker_image: osrf/ros:jazzy-desktop

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt install -y ros-${{ matrix.ros_distro }}-moveit* ros-${{ matrix.ros_distro }}-camera-info-manager ros-${{ matrix.ros_distro }}-cv-bridge ros-${{ matrix.ros_distro }}-behaviortree-cpp-v3 libsdl1.2-dev libopencv-dev libopencv-contrib-dev libnlopt-dev libnlopt-cxx-dev
      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build
