# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - Joint0
      - joint1
      - Joint2
      - Joint3
      - joint4
      - Joint5
      - Joint6
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity