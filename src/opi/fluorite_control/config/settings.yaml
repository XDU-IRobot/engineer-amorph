/**:
  ros__parameters:
    # can net interface names
    chassis_can_port: "can0"
    arm_can_port: "can1"

# launch.py->node->name
fluorite_chassis:
  ros__parameters:
    # dji motor ids
    l_front_wheel_id: 1
    l_mid_wheel_id: 3
    l_rear_wheel_id: 2
    l_lift_wheel_id: 4
    r_front_wheel_id: 5
    r_mid_wheel_id: 7
    r_rear_wheel_id: 6
    r_lift_wheel_id: 8

    # pid param
    pid_l_front_speed: [5.0, 0.0, 0.0]
    pid_l_mid_speed: [9.2, 0.0, 0.0]
    pid_l_rear_speed: [5.0, 0.0, 0.0]
    pid_l_lift_speed: [8.5, 0.0, 0.0]
    pid_r_front_speed: [5.0, 0.0, 0.0]
    pid_r_mid_speed: [5.0, 0.0, 0.0]
    pid_r_rear_speed: [5.0, 0.0, 0.0]
    pid_r_lift_speed: [8.5, 0.0, 0.0]
    pid_l_lift_position: [1.0, 0.0, 0.0]
    pid_r_lift_position: [1.0, 0.0, 0.0]

    # motor settings
    l_front_wheel_reverse: false
    l_mid_wheel_reverse: false
    l_rear_wheel_reverse: false
    l_lift_wheel_reverse: false
    r_front_wheel_reverse: true
    r_mid_wheel_reverse: true
    r_rear_wheel_reverse: true
    r_lift_wheel_reverse: true

    # configurations
    lift_encoder_delta: -114785.0
    lower_encoder_delta: 108734.0

    # input settings
    control_use_fpv_channel: false # 使用图传链路控制
    control_invert_vertical: false
    control_invert_horizontal: false
    control_sensitivity_vertical: 2200.0
    control_sensitivity_horizontal: 2200.0