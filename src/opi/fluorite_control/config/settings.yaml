/**:
  ros__parameters:
    # can net interface names
    chassis_can_port: "can0"
    arm_can_port: "can1"

    base_yaw_id: 1
    base_yaw_reverse: false
    base_yaw_encoder_zero_offset: 5.33863639831543

fluorite_control_chassis:
  ros__parameters:
    # motor id
    lf_wheel_id: 1
    rf_wheel_id: 2
    lr_wheel_id: 3
    rr_wheel_id: 4
    lf_steer_id: 1
    rf_steer_id: 2
    lr_steer_id: 3
    rr_steer_id: 4

    # pid param
    pid_lf_wheel_speed: [9.5, 0.0, 0.0, 10000.0, 0.0]
    pid_rf_wheel_speed: [9.5, 0.0, 0.0, 10000.0, 0.0]
    pid_lr_wheel_speed: [9.5, 0.0, 0.0, 10000.0, 0.0]
    pid_rr_wheel_speed: [9.5, 0.0, 0.0, 10000.0, 0.0]
    pid_lf_steer_speed: [110.0, 0.0, 0.0, 20000.0, 0.0]
    pid_rf_steer_speed: [110.0, 0.0, 0.0, 20000.0, 0.0]
    pid_lr_steer_speed: [110.0, 0.0, 0.0, 20000.0, 0.0]
    pid_rr_steer_speed: [110.0, 0.0, 0.0, 20000.0, 0.0]
    pid_lf_steer_position: [196.0, 0.0, 0.0, 145.0, 0.0]
    pid_rf_steer_position: [196.0, 0.0, 0.0, 145.0, 0.0]
    pid_lr_steer_position: [196.0, 0.0, 0.0, 145.0, 0.0]
    pid_rr_steer_position: [196.0, 0.0, 0.0, 145.0, 0.0]
    pid_chassis_orientation_position: [13500.0, 0.0, 0.0, 5000.0, 5000.0]

    # motor settings
    lf_wheel_reverse: false
    rf_wheel_reverse: false
    lr_wheel_reverse: false
    rr_wheel_reverse: false
    lf_steer_reverse: false
    rf_steer_reverse: false
    lr_steer_reverse: false
    rr_steer_reverse: false

    # encoder offsets
    lf_steer_front_encoder: 2.3472771644592285
    rf_steer_front_encoder: 2.286677598953247
    lr_steer_front_encoder: 3.2992281913757324
    rr_steer_front_encoder: 4.350900650024414

    # input settings
    control_use_fpv_channel: false # 使用图传链路控制
    control_invert_vertical: true
    control_invert_horizontal: true
    control_sensitivity_vertical: 4.3
    control_sensitivity_horizontal: 4.3

fluorite_control_arm:
  ros__parameters:
    # motor id
    yaw_master_id: 0xc9
    yaw_slave_id: 0xca
    pitch_1_master_id: 0xc1
    pitch_1_slave_id: 0xc2
    pitch_2_master_id: 0xc3
    pitch_2_slave_id: 0xc4
    end_yaw_1_master_id: 0xc5
    end_yaw_1_slave_id: 0xc6
    end_pitch_master_id: 0xc7
    end_pitch_slave_id: 0xc8
    end_yaw_2_id: 1

    # pid param
    pid_base_yaw_speed: [0.20, 0.0, 0.0, 10.0, 10.0]
    pid_yaw_speed: [-3.5, 0.0, 0.0, 10.0, 10.0]
    pid_pitch_1_speed: [3.65, 0.0, 0.0, 20.0, 20.0]
    pid_pitch_2_speed: [-3.0, 0.0, 0.0, 10.0, 10.0]
    pid_end_yaw_1_speed: [-0.6, 0.0, 0.0, 3.0, 3.0]
    pid_end_pitch_speed: [0.45, 0.0, 0.0, 3.0, 3.0]
    pid_end_yaw_2_speed: [78.0, 0.0, 0.0, 5000.0, 5000.0]
    pid_base_yaw_position: [425.0, 0.0, 24000.0, 130.0, 130.0]
    pid_yaw_position: [40.0, 0.0, 230.0, 3.4, 3.4]
    pid_pitch_1_position: [85.0, 0.0, 1.0, 4.0, 4.0]
    pid_pitch_2_position: [30.0, 0.0, 0.0, 4.0, 4.0]
    pid_end_yaw_1_position: [30.0, 0.0, 0.0, 2.5, 2.5]
    pid_end_pitch_position: [45.0, 0.0, 30.0, 2.0, 2.0]
    pid_end_yaw_2_position: [600.0, 0.0, 0.0, 40.0, 40.0]

    # low-pass filter settings
    ## 截止频率应该小于采样频率的一半！(anti-aliasing)
    ## 调参过程中发现滤波器的相位延迟会导致震荡，所以实际上没有用滤波器，这几个参数无效
    lpf_sample_rate: 400
    lpf_cutoff_freq_yaw: 200
    lpf_cutoff_freq_pitch_1: 200
    lpf_cutoff_freq_pitch_2: 200
    lpf_cutoff_freq_end_yaw_1: 200
    lpf_cutoff_freq_end_pitch: 200
    lpf_cutoff_freq_end_yaw_2: 200

    # encoder offsets
    yaw_encoder_zero_offset: 0.17223644256591797 # -0.5369272232055664 0.17223644256591797
    pitch_1_encoder_zero_offset: -1.0486761331558228
    pitch_2_encoder_zero_offset: -2.723163604736328
    end_yaw_1_encoder_zero_offset: -2.0185775756835938
    end_pitch_encoder_zero_offset: 0.6269550323486328
    end_yaw_2_encoder_zero_offset: 2.892673969268799

    # motor settings
    yaw_reverse: true
    pitch_1_reverse: false
    pitch_2_reverse: true
    end_yaw_1_reverse: true
    end_pitch_reverse: false
    end_yaw_2_reverse: false

    # gpio settings
    sucker_out_valve_pin: 11
    sucker_in_valve_pin: 12
    sucker_vaccum_pump_pin: 2 # pwm15_m2
    storage_left_valve_pin: 14
    storage_right_valve_pin: 15
    storage_vaccum_pump_pin: 16 # pwm1_m2

    # input settings
    control_use_fpv_channel: false # 使用图传链路控制
    control_invert_vertical: true
    control_invert_horizontal: true
    control_sensitivity_vertical: 1.0
    control_sensitivity_horizontal: 1.0
