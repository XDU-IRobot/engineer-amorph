/**:
  ros__parameters:
    # can net interface names
    chassis_can_port: "can0"
    arm_can_port: "can1"

# launch.py->node->name
fluorite_control_chassis:
  ros__parameters:
    # dji motor ids
    lf_wheel_id: 2
    rf_wheel_id: 1
    lr_wheel_id: 3
    rr_wheel_id: 4
    lf_steer_id: 2
    rf_steer_id: 1
    lr_steer_id: 3
    rr_steer_id: 4

    # pid param
    pid_lf_wheel_speed: [8.5, 0.0, 0.0, 10000.0, 0.0]
    pid_rf_wheel_speed: [8.5, 0.0, 0.0, 10000.0, 0.0]
    pid_lr_wheel_speed: [8.5, 0.0, 0.0, 10000.0, 0.0]
    pid_rr_wheel_speed: [8.5, 0.0, 0.0, 10000.0, 0.0]
    pid_lf_steer_speed: [165.0, 0.0, 0.0, 16384.0, 0.0]
    pid_rf_steer_speed: [165.0, 0.0, 0.0, 16384.0, 0.0]
    pid_lr_steer_speed: [165.0, 0.0, 0.0, 16384.0, 0.0]
    pid_rr_steer_speed: [165.0, 0.0, 0.0, 16384.0, 0.0]
    pid_lf_steer_position: [195.0, 0.0, 0.0, 145.0, 0.0]
    pid_rf_steer_position: [195.0, 0.0, 0.0, 145.0, 0.0]
    pid_lr_steer_position: [195.0, 0.0, 0.0, 145.0, 0.0]
    pid_rr_steer_position: [195.0, 0.0, 0.0, 145.0, 0.0]

    # motor settings
    lf_wheel_reverse: true
    rf_wheel_reverse: false
    lr_wheel_reverse: true
    rr_wheel_reverse: false
    lf_steer_reverse: false
    rf_steer_reverse: false
    lr_steer_reverse: false
    rr_steer_reverse: false

    # configurations
    lf_steer_front_encoder: 0.7693852782249451
    rf_steer_front_encoder: 0.7548106908798218
    lr_steer_front_encoder: 0.17642933130264282
    rr_steer_front_encoder: 4.416102409362793

    # input settings
    control_use_fpv_channel: false # 使用图传链路控制
    control_invert_vertical: true
    control_invert_horizontal: true
    control_sensitivity_vertical: 4.3
    control_sensitivity_horizontal: 4.3
