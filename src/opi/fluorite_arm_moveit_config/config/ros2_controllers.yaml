# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    end_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - yaw_joint
      - pitch1_joint
      - pitch2_joint
      - endyaw1_joint
      - endpitch_joint
      - endyaw2_joint
    command_interfaces:
      []
    state_interfaces:
      []
end_controller:
  ros__parameters:
    joint: endyaw2_joint
    command_interfaces:
      []
    state_interfaces:
      []