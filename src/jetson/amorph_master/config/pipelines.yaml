planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: ["ompl", "pilz_industrial_motion_planner"]

# ------------------------- 默认单 pipeline 请求参数 -------------------------
plan_request_params:
  planning_attempts: 1
  planning_pipeline: ompl
  planner_id: "RRTConnectkConfigDefault"
  max_velocity_scaling_factor: 1.0
  max_acceleration_scaling_factor: 1.0
  planning_time: 1.0

# ------------- 以下为具名请求配置，供 MultiPipelinePlanRequestParameters 使用 -------------
ompl_rrtconnect:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: ompl
    planner_id: "RRTConnectkConfigDefault"
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    planning_time: 1.0

pilz_ptp:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: pilz_industrial_motion_planner
    planner_id: "PTP"
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    planning_time: 1.0

# LIN / CIRC 是笛卡尔直线/圆弧运动，先给较低的速度缩放，避免撞限
pilz_lin:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: pilz_industrial_motion_planner
    planner_id: "LIN"
    max_velocity_scaling_factor: 0.1
    max_acceleration_scaling_factor: 0.1
    planning_time: 1.0

pilz_circ:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: pilz_industrial_motion_planner
    planner_id: "CIRC"
    max_velocity_scaling_factor: 0.1
    max_acceleration_scaling_factor: 0.1
    planning_time: 1.0
