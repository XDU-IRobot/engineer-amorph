/**:
  ros__parameters:
    pick_energy_unit_task:
      # Total planning attempts
      max_solutions: 10

      # Planning group and link names
      arm_group_name: "arm_l"
      eef_name: "gripper_l"
      hand_group_name: "gripper_l"
      hand_frame: "gripper_base_l"

      # Poses
      hand_open_pose: "open"
      hand_close_pose: "close"
      arm_home_pose: "hold_eu"

      # Controller names
      arm_controller_name: "arm_l_controller"
      hand_controller_name: "gripper_l_controller"

      # Scene frames
      world_frame: "world"
      table_reference_frame: "world"
      object_reference_frame: "world"
      surface_link: "table"

      # Collision object for picking
      # CYLINDER object specifications
      object_name: "object"
      object_dimensions: [0.25, 0.02] # [height, radius]
      # object_pose: [-0.5, -0.45, -0.25, 0.0, 0.0, 0.0]
      object_pose: [0.0944, -0.51, 0.46, 0.0, 0.0, 0.0]
      

      # Table model
      spawn_table: true
      table_name: "table"
      table_dimensions: [0.4, 0.5, 0.1]  # [length, width, height]
      table_pose: [0.5, -0.25, 0.0, 0.0, 0.0, 0.0]

      # Gripper grasp frame transform [x,y,z,r,p,y]
      grasp_frame_transform: [0.0, 0.075, 0.17, -1.57, 3.1415927, 0.0]

      # Place pose [x,y,z,r,p,y]
      place_pose: [0.0, -0.15, 0.0, 0.0, 0.0, 0.0]
      place_surface_offset: 0.0001 # place offset from table

      # Valid distance range when approaching an object for picking
      approach_object_min_dist: 0.03
      approach_object_max_dist: 0.11

      # Valid height range when lifting an object after pick
      lift_object_min_dist: 0.01
      lift_object_max_dist: 0.1
