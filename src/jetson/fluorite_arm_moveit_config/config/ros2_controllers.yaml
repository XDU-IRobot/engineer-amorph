# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    fluorite_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    fluorite_end_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fluorite_arm_controller:
  ros__parameters:
    joints:
      - yaw_joint
      - pitch_1_joint
      - pitch_2_joint
      - end_yaw_1_joint
      - end_pitch_joint
      - end_yaw_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
fluorite_end_controller:
  ros__parameters:
    joint: end_yaw_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity